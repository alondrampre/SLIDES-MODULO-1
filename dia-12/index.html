<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 12 - Martes: Vectores, Pluma y Buscatrazos</title>
  
  <!-- Google Fonts: Arvo & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracotta: #bb371e;
      --teal: #058080;
      --dark-navy: #151f30;
      --coral: #ff7a48;
      --deep-blue: #103778;
      --yellow: #ffbb27;
      --white: #ffffff;
      --light-gray: #e2e8f0;
      --dark-card: #1c273a;
      
      --font-title: 'Arvo', serif;
      --font-body: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark-navy);
      color: var(--white);
      font-family: var(--font-body);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header#top-bar {
      height: 54px;
      background: rgba(16, 23, 38, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--terracotta);
      color: var(--white);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-weight: 600;
    }

    .class-title-header {
      font-size: 0.95rem;
      color: var(--light-gray);
      font-weight: 500;
    }

    .top-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .btn-notes {
      background: rgba(5, 128, 128, 0.2);
      border-color: var(--teal);
      color: var(--teal);
    }

    .btn-notes:hover {
      background: var(--teal);
      color: var(--white);
    }

    /* Main Viewport */
    main#viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 50px;
      overflow: hidden;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 680px;
      background: var(--dark-card);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 50px;
      overflow: hidden;
    }

    /* Slide Header & Footer Indicators */
    .slide-indicator {
      position: absolute;
      top: 30px;
      right: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slide-num-badge {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--yellow);
      opacity: 0.9;
    }

    .slide-footer-bar {
      position: absolute;
      bottom: 25px;
      left: 50px;
      right: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
    }

    /* Slide Layouts */
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h2.slide-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 20px;
      line-height: 1.25;
    }

    .slide-body {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .slide-body ul {
      list-style-type: none;
      margin-top: 10px;
    }

    .slide-body ul li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 12px;
    }

    .slide-body ul li::before {
      content: '•';
      color: var(--coral);
      font-size: 1.5rem;
      position: absolute;
      left: 4px;
      top: -4px;
    }

    /* Title Layout */
    .layout-title {
      text-align: center;
      align-items: center;
    }

    .layout-title h2.slide-title {
      font-size: 2.8rem;
      color: var(--white);
      margin-bottom: 15px;
    }

    .class-pill {
      display: inline-block;
      background: rgba(255, 122, 72, 0.15);
      color: var(--coral);
      border: 1px solid var(--coral);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .highlight-text {
      color: var(--yellow);
      font-weight: 600;
      margin-top: 15px;
    }

    /* Split Layout */
    .layout-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      height: 100%;
    }

    .media-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      overflow: hidden;
    }

    .media-container img {
      max-width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .diagram-canvas {
      width: 100%;
      max-height: 260px;
    }

    .image-placeholder {
      border: 2px dashed var(--teal);
      background: rgba(5, 128, 128, 0.08);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: var(--teal);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Grid Layout */
    .layout-grid-container {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 20px;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--yellow);
    }

    .card-icon {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .card-num {
      font-family: var(--font-title);
      color: var(--terracotta);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .card-title {
      font-family: var(--font-title);
      color: var(--yellow);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--light-gray);
      line-height: 1.4;
    }

    /* Quote Layout */
    .layout-quote {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .quote-text {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--yellow);
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .quote-author {
      font-size: 1.1rem;
      color: var(--coral);
      font-weight: 600;
    }

    /* Bottom Controls */
    footer#bottom-controls {
      height: 60px;
      background: rgba(16, 23, 38, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--white);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--yellow));
      width: 0%;
      transition: width 0.3s ease;
    }

    .slide-counter {
      font-family: var(--font-title);
      font-weight: 700;
      color: var(--yellow);
      font-size: 1rem;
    }

    /* Speaker Notes Drawer (Aisladas de la diapositiva) */
    .notes-drawer {
      position: fixed;
      right: -420px;
      top: 54px;
      bottom: 60px;
      width: 400px;
      background: #111827;
      border-left: 2px solid var(--teal);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 25px;
      overflow-y: auto;
    }

    .notes-drawer.open {
      right: 0;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .notes-header h3 {
      font-family: var(--font-title);
      color: var(--teal);
      font-size: 1.1rem;
    }

    .close-notes-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-notes-btn:hover {
      color: var(--white);
    }

    .notes-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .notes-content h3 {
      color: var(--yellow);
      margin: 15px 0 8px 0;
      font-size: 1rem;
    }

    .notes-content p {
      margin-bottom: 12px;
    }

    /* ==========================================================================
       MODO PANTALLA COMPLETA: SOLO LA SLIDE (OCULTA BARRA SUPERIOR E INFERIOR)
       ========================================================================== */
    :fullscreen header#top-bar,
    :fullscreen footer#bottom-controls,
    :-webkit-full-screen header#top-bar,
    :-webkit-full-screen footer#bottom-controls {
      display: none !important;
    }

    :fullscreen main#viewport,
    :-webkit-full-screen main#viewport {
      padding: 0 !important;
      height: 100vh !important;
      width: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      background: var(--dark-navy) !important;
    }

    :fullscreen .slide-wrapper,
    :-webkit-full-screen .slide-wrapper {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      padding: 60px 80px !important;
    }
  </style>
</head>

  <script>
    const slidesData = [
  {
    "layout": "title",
    "title": "Vectores, Pluma y Buscatrazos",
    "subtitle": "Semana 3 - Martes / Técnica Vectorial",
    "content": "<p>Diferencia entre vector y píxel, dibujo técnico con la pluma y operaciones geométricas.</p><p class='highlight-text'>\"Vectores con pocos nodos es el modo\"</p>",
    "notes": "<h3>Clase práctica de vectores</h3><p>Hoy entramos de lleno a la técnica de vectorización en Illustrator. Veremos cómo dominar la Pluma y el panel Buscatrazos.</p>"
  },
  {
    "layout": "split",
    "title": "¿Qué es un Vector?",
    "content": "<p>Representación matemática de formas basada en puntos, líneas y curvas:</p><ul><li><strong>Escalabilidad infinita:</strong> No pierde resolución al agrandarse (a diferencia del píxel / mapa de bits).</li><li>Peso de archivo reducido.</li><li>Ideal para logotipos, tipografía e ilustraciones geométricas.</li></ul>",
    "media": "images/d12-martes-slide02.jpg",
    "notes": "<h3>Explicación</h3><p>Muestra cómo el vector dibuja curvas perfectas mediante ecuaciones, mientras que el píxel divide la pantalla en rejillas fijas.</p>"
  },
  {
    "layout": "split",
    "title": "La Herramienta Pluma (Pen Tool)",
    "content": "<p>El motor del dibujo vectorial profesional:</p><ul><li>Dibuja trazados precisos uniendo puntos de ancla.</li><li><strong>Puntos de ancla (Anchor Points):</strong> Definen dónde cambia de dirección la línea.</li><li><strong>Manejadores (Direction Handles):</strong> Definen la curvatura y dirección.</li></ul>",
    "media": "images/d12-martes-slide03.jpg",
    "notes": "<h3>Demostración</h3><p>Explica que arrastrar con la pluma crea manejadores de curvas Bézier. Un solo clic crea esquinas rectas.</p>"
  },
  {
    "layout": "split",
    "title": "Pocos Nodos es el Modo",
    "content": "<p>La regla de oro de la vectorización limpia:</p><ul><li>Usa la menor cantidad de puntos de ancla posibles.</li><li>A mayor cantidad de nodos, la curva se vuelve irregular y temblorosa.</li><li>Coloca los nodos en las puntas extremas de la curva (puntos tangenciales).</li></ul>",
    "media": "images/d12-martes-slide04.jpg",
    "notes": "<h3>Consejo técnico</h3><p>Un vector con exceso de nodos es el sello de un diseñador amateur. Enseña a simplificar trazados.</p>"
  },
  {
    "layout": "split",
    "title": "El panel Buscatrazos (Pathfinder)",
    "content": "<p>Permite combinar formas geométricas simples para crear figuras complejas:</p><ul><li><strong>Unificar (Unite):</strong> Fusiona formas en una sola.</li><li><strong>Menos Frente (Minus Front):</strong> Resta la forma superior de la inferior.</li><li><strong>Intersección (Intersect):</strong> Conserva solo la zona común.</li><li><strong>Dividir (Divide):</strong> Corta la pieza en fragmentos independientes.</li></ul>",
    "media": "images/d12-martes-slide05.jpg",
    "notes": "<h3>Práctica</h3><p>Muestra cómo crear la silueta de una llave o un engranaje usando solo rectángulos, círculos y el buscatrazos.</p>"
  },
  {
    "layout": "split",
    "title": "El Creador de Formas (Shape Builder)",
    "content": "<p>Una alternativa intuitiva al Buscatrazos:</p><ul><li>Selecciona las formas superpuestas.</li><li>Arrastra para unir secciones o mantén presionada la tecla Alt y haz clic para borrarlas.</li><li>Permite dibujar intuitivamente sobre intersecciones complejas.</li></ul>",
    "media": "images/d12-martes-slide06.jpg",
    "notes": "<h3>Atajo</h3><p>Muestra el atajo Shift + M en Illustrator. Es una de las herramientas más queridas por los ilustradores vectoriales.</p>"
  },
  {
    "layout": "split",
    "title": "Tipos de Archivos Vectoriales",
    "content": "<p>Formatos estándar de exportación:</p><ul><li><strong>.AI (Adobe Illustrator):</strong> Formato nativo de trabajo. Conserva capas y efectos editables.</li><li><strong>.SVG (Scalable Vector Graphics):</strong> Estándar para web e interactividad. Totalmente responsive.</li><li><strong>.EPS:</strong> Clásico para imprenta a gran escala.</li><li><strong>.PDF Vectorial:</strong> Formato universal para impresión y revisión del cliente.</li></ul>",
    "media": "images/d12-martes-slide07.jpg",
    "notes": "<h3>Recomendación</h3><p>Usa SVG para iconos de interfaces web y PDF para enviar folletos a la imprenta.</p>"
  },
  {
    "layout": "split",
    "title": "Estilos de Párrafo y Carácter",
    "content": "<p>Gestión tipográfica escalable en Illustrator:</p><ul><li><strong>Estilos de párrafo:</strong> Configuran el bloque completo (fuente, leading, alineación, sangría).</li><li><strong>Estilos de carácter:</strong> Modificaciones puntuales sobre palabras sueltas (ej. poner una palabra en negrita o coral).</li></ul>",
    "media": "images/d12-martes-slide08.jpg",
    "notes": "<h3>Editorial</h3><p>Explica que usar estilos de párrafo permite cambiar la tipografía de un documento de 50 páginas en un solo clic.</p>"
  },
  {
    "layout": "split",
    "title": "Reglas, Guías e Imantación",
    "content": "<p>Asegurando la precisión matemática en la diagramación:</p><ul><li>Usa guías inteligentes (`Ctrl + U`) para alinear al milímetro.</li><li>Bloquea guías para evitar moverlas por accidente.</li><li>Usa la imantación de píxel o de punto de ancla según el soporte (pantalla o imprenta).</li></ul>",
    "media": "images/d12-martes-slide09.jpg",
    "notes": "<h3>Aclaración</h3><p>La precisión técnica en las alineaciones es lo que separa a un diseño profesional de uno descuidado.</p>"
  },
  {
    "layout": "split",
    "title": "Gradientes y Motivos (Patterns)",
    "content": "<p>Añadiendo volumen y texturas vectoriales:</p><ul><li><strong>Degradados (Gradientes):</strong> Transición suave entre dos o más colores (lineales, radiales o de malla).</li><li><strong>Motivos (Patterns):</strong> Repetición modular de una forma para crear texturas o fondos ilustrativos consistentes.</li></ul>",
    "media": "images/d12-martes-slide10.jpg",
    "notes": "<h3>Branding</h3><p>Señala que los patrones (patterns) son un entregable clave en la semana 6 del TP Final para construir universos visuales.</p>"
  },
  {
    "layout": "split",
    "title": "El Calco de Imagen (Image Trace)",
    "content": "<p>Convertir mapas de bits en vectores automáticamente:</p><ul><li>Útil para digitalizar bocetos a tinta o lápiz de forma rápida.</li><li>Requiere ajuste de umbral, ruido y curvas en el panel avanzado.</li><li>Casi siempre exige un refinamiento manual posterior para borrar nodos basura.</li></ul>",
    "media": "images/d12-martes-slide11.jpg",
    "notes": "<h3>Advertencia</h3><p>Nunca uses el calco de imagen directo sobre logotipos pixelados de marcas reales; el resultado carece de la precisión geométrica que exige un logo profesional.</p>"
  },
  {
    "layout": "grid",
    "title": "Checklist Vectorial",
    "content": "<h2>Antes de finalizar tu ilustración vectorial, revisa:</h2>",
    "cards": [
      {
        "num": "01",
        "title": "¿Nodos limpios?",
        "desc": "Elimina puntos de ancla duplicados o innecesarios.",
        "icon": "💡"
      },
      {
        "num": "02",
        "title": "¿Modo color?",
        "desc": "Asegura CMYK si vas a imprimir o RGB para web.",
        "icon": "⚙️"
      },
      {
        "num": "03",
        "title": "¿Trazos expandidos?",
        "desc": "Expande trazos y fuentes a contornos para evitar desconfiguraciones en otras PCs.",
        "icon": "🎨"
      },
      {
        "num": "04",
        "title": "¿Guías ocultas?",
        "desc": "Limpia la mesa de trabajo de guías sobrantes.",
        "icon": "🔬"
      }
    ],
    "notes": "<h3>Consejo</h3><p>La combinación de teclas Ctrl + Y (modo contorno) muestra la estructura vectorial pura y ayuda a encontrar nodos perdidos.</p>"
  },
  {
    "layout": "title",
    "title": "Carrera de Vectorización",
    "subtitle": "Ingresen al archivo de Figma o Illustrator y vectoricen la silueta compleja usando la menor cantidad de nodos posible.",
    "content": "<p class='highlight-text'>El estudiante con la curva más limpia y menos nodos gana la dinámica.</p>",
    "notes": "<h3>Cierre</h3><p>Evalúa las siluetas vectorizadas en vivo, contando los nodos y mostrando buenas prácticas de trazado Bézier.</p>"
  }
];
    let currentIndex = 0;
    let notesOpen = false;

    const slideWrapper = document.getElementById('slide-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const slideCounter = document.getElementById('slide-counter');
    const progressBar = document.getElementById('progress-bar');
    const notesDrawer = document.getElementById('notes-drawer');
    const notesContent = document.getElementById('notes-content');
    const toggleNotesBtn = document.getElementById('toggle-notes-btn');
    const closeNotesBtn = document.getElementById('close-notes-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    // Automatic extension fallback if image format differs (.png, .jpg, .svg, .webp)
    function handleImageError(img) {
      const cleanSrc = img.src.split('?')[0];
      if (!img.dataset.triedExt) {
        img.dataset.triedExt = 'png';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.png') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'png') {
        img.dataset.triedExt = 'jpg';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.jpg') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'jpg') {
        img.dataset.triedExt = 'svg';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.svg') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'svg') {
        img.dataset.triedExt = 'webp';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.webp') + '?t=' + Date.now();
      }
    }

    function renderSlide(index) {
      const slide = slidesData[index];
      const slideNum = String(index + 1).padStart(2, '0');
      
      let layoutHtml = '';

      if (slide.layout === 'title') {
        layoutHtml = `
          <div class="slide-content layout-title">
            <div class="class-pill">MÓDULO 1 &bull; DÍA 12</div>
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
            ${slide.subtitle ? `<div class="highlight-text" style="margin-top:20px;">${slide.subtitle}</div>` : ''}
          </div>
        `;
      } else if (slide.layout === 'quote') {
        layoutHtml = `
          <div class="slide-content layout-quote">
            <div class="quote-text">“${slide.content}”</div>
            <div class="quote-author">— ${slide.title}</div>
          </div>
        `;
      } else if (slide.layout === 'split') {
        let mediaContent = '';
        if (slide.media) {
          const mediaSrc = slide.media.startsWith('images/') ? '../' + slide.media : slide.media;
          if (slide.media.trim().startsWith('<svg')) {
            mediaContent = slide.media;
          } else {
            mediaContent = `<img src="${mediaSrc}?t=${Date.now()}" onerror="handleImageError(this)" alt="${slide.title}" style="max-width:100%; max-height:320px; object-fit:cover; border-radius:8px;">`;
          }
        } else {
          mediaContent = `<div class="image-placeholder">[IMAGEN: Ilus. o diagrama de ${slide.title}]</div>`;
        }

        layoutHtml = `
          <div class="layout-split">
            <div class="slide-content">
              <h2 class="slide-title">${slide.title}</h2>
              <div class="slide-body">${slide.content || ''}</div>
            </div>
            <div class="media-container">
              ${mediaContent}
            </div>
          </div>
        `;
      } else if (slide.layout === 'grid') {
        let cardsHtml = '';
        let gridCols = 'grid-3';
        if (slide.cards) {
          if (slide.cards.length === 2) gridCols = 'grid-2';
          else if (slide.cards.length === 4) gridCols = 'grid-4';

          cardsHtml = slide.cards.map(c => `
            <div class="card">
              ${c.icon ? `<div class="card-icon">${c.icon}</div>` : ''}
              ${c.num && !c.icon ? `<div class="card-num">${c.num}</div>` : ''}
              <div class="card-title">${c.title}</div>
              <div class="card-desc">${c.desc}</div>
            </div>
          `).join('');
        }

        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
            <div class="layout-grid-container ${gridCols}">
              ${cardsHtml}
            </div>
          </div>
        `;
      } else {
        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
          </div>
        `;
      }

      slideWrapper.innerHTML = `
        <div class="slide-indicator">
          <span class="slide-num-badge">${slideNum}</span>
        </div>
        ${layoutHtml}
        <div class="slide-footer-bar">
          <span>Martes: Vectores, Pluma y Buscatrazos</span>
          <span>Día 12</span>
        </div>
      `;

      // Update speaker notes
      notesContent.innerHTML = slide.notes || '<p>No hay notas adicionales para esta diapositiva.</p>';

      // Update controls
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slidesData.length - 1;
      slideCounter.textContent = `${slideNum} / ${String(slidesData.length).padStart(2, '0')}`;
      progressBar.style.width = `${((index + 1) / slidesData.length) * 100}%`;
    }

    function goToNext() {
      if (currentIndex < slidesData.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    // Navigation Events
    nextBtn.addEventListener('click', goToNext);
    prevBtn.addEventListener('click', goToPrev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        goToNext();
      } else if (e.key === 'ArrowLeft') {
        goToPrev();
      } else if (e.key.toLowerCase() === 'p') {
        toggleNotes();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Notes drawer toggle
    function toggleNotes() {
      notesOpen = !notesOpen;
      notesDrawer.classList.toggle('open', notesOpen);
    }

    toggleNotesBtn.addEventListener('click', toggleNotes);
    closeNotesBtn.addEventListener('click', () => {
      notesOpen = false;
      notesDrawer.classList.remove('open');
    });

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Initial Render
    renderSlide(currentIndex);
  </script>
</body>
</html>
