<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 7 - Martes: Color, Postimpresión y Procesos</title>
  
  <!-- Google Fonts: Arvo & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracotta: #bb371e;
      --teal: #058080;
      --dark-navy: #151f30;
      --coral: #ff7a48;
      --deep-blue: #103778;
      --yellow: #ffbb27;
      --white: #ffffff;
      --light-gray: #e2e8f0;
      --dark-card: #1c273a;
      
      --font-title: 'Arvo', serif;
      --font-body: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark-navy);
      color: var(--white);
      font-family: var(--font-body);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header#top-bar {
      height: 54px;
      background: rgba(16, 23, 38, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--terracotta);
      color: var(--white);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-weight: 600;
    }

    .class-title-header {
      font-size: 0.95rem;
      color: var(--light-gray);
      font-weight: 500;
    }

    .top-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .btn-notes {
      background: rgba(5, 128, 128, 0.2);
      border-color: var(--teal);
      color: var(--teal);
    }

    .btn-notes:hover {
      background: var(--teal);
      color: var(--white);
    }

    /* Main Viewport */
    main#viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 50px;
      overflow: hidden;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 680px;
      background: var(--dark-card);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 50px;
      overflow: hidden;
    }

    /* Slide Header & Footer Indicators */
    .slide-indicator {
      position: absolute;
      top: 30px;
      right: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slide-num-badge {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--yellow);
      opacity: 0.9;
    }

    .slide-footer-bar {
      position: absolute;
      bottom: 25px;
      left: 50px;
      right: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
    }

    /* Slide Layouts */
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h2.slide-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 20px;
      line-height: 1.25;
    }

    .slide-body {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .slide-body ul {
      list-style-type: none;
      margin-top: 10px;
    }

    .slide-body ul li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 12px;
    }

    .slide-body ul li::before {
      content: '•';
      color: var(--coral);
      font-size: 1.5rem;
      position: absolute;
      left: 4px;
      top: -4px;
    }

    /* Title Layout */
    .layout-title {
      text-align: center;
      align-items: center;
    }

    .layout-title h2.slide-title {
      font-size: 2.8rem;
      color: var(--white);
      margin-bottom: 15px;
    }

    .class-pill {
      display: inline-block;
      background: rgba(255, 122, 72, 0.15);
      color: var(--coral);
      border: 1px solid var(--coral);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .highlight-text {
      color: var(--yellow);
      font-weight: 600;
      margin-top: 15px;
    }

    /* Split Layout */
    .layout-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      height: 100%;
    }

    .media-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      overflow: hidden;
    }

    .media-container img {
      max-width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .diagram-canvas {
      width: 100%;
      max-height: 260px;
    }

    .image-placeholder {
      border: 2px dashed var(--teal);
      background: rgba(5, 128, 128, 0.08);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: var(--teal);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Grid Layout */
    .layout-grid-container {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 20px;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--yellow);
    }

    .card-icon {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .card-num {
      font-family: var(--font-title);
      color: var(--terracotta);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .card-title {
      font-family: var(--font-title);
      color: var(--yellow);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--light-gray);
      line-height: 1.4;
    }

    /* Quote Layout */
    .layout-quote {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .quote-text {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--yellow);
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .quote-author {
      font-size: 1.1rem;
      color: var(--coral);
      font-weight: 600;
    }

    /* Bottom Controls */
    footer#bottom-controls {
      height: 60px;
      background: rgba(16, 23, 38, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--white);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--yellow));
      width: 0%;
      transition: width 0.3s ease;
    }

    .slide-counter {
      font-family: var(--font-title);
      font-weight: 700;
      color: var(--yellow);
      font-size: 1rem;
    }

    /* Speaker Notes Drawer (Aisladas de la diapositiva) */
    .notes-drawer {
      position: fixed;
      right: -420px;
      top: 54px;
      bottom: 60px;
      width: 400px;
      background: #111827;
      border-left: 2px solid var(--teal);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 25px;
      overflow-y: auto;
    }

    .notes-drawer.open {
      right: 0;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .notes-header h3 {
      font-family: var(--font-title);
      color: var(--teal);
      font-size: 1.1rem;
    }

    .close-notes-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-notes-btn:hover {
      color: var(--white);
    }

    .notes-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .notes-content h3 {
      color: var(--yellow);
      margin: 15px 0 8px 0;
      font-size: 1rem;
    }

    .notes-content p {
      margin-bottom: 12px;
    }

    /* ==========================================================================
       MODO PANTALLA COMPLETA: SOLO LA SLIDE (OCULTA BARRA SUPERIOR E INFERIOR)
       ========================================================================== */
    :fullscreen header#top-bar,
    :fullscreen footer#bottom-controls,
    :-webkit-full-screen header#top-bar,
    :-webkit-full-screen footer#bottom-controls {
      display: none !important;
    }

    :fullscreen main#viewport,
    :-webkit-full-screen main#viewport {
      padding: 0 !important;
      height: 100vh !important;
      width: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      background: var(--dark-navy) !important;
    }

    :fullscreen .slide-wrapper,
    :-webkit-full-screen .slide-wrapper {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      padding: 60px 80px !important;
    }
  </style>
</head>

  <aside class="notes-drawer" id="notes-drawer">

      <h3>🎙️ Guía del Docente / Orador</h3>
      <button class="close-notes-btn" id="close-notes-btn">&times;</button>

  <script>
    const slidesData = [
  {
    "layout": "title",
    "title": "Teoría, Psicología y Accesibilidad del Color",
    "subtitle": "Semana 2 - Martes / Color y Postimpresión",
    "content": "<p>Física del color, modelos cromáticos (RGB vs CMYK), contrastes de Itten y procesos de impresión.</p>",
    "notes": "<h3>Clase técnica</h3><p>Hoy abordamos el color desde lo físico, lo digital y lo impreso, con fuerte foco en accesibilidad (daltonismo) y técnicas de postimpresión.</p>"
  },
  {
    "layout": "split",
    "title": "Física del Color: RGB vs. CMYK",
    "content": "<p>Dos modelos cromáticos con objetivos totalmente opuestos:</p><ul><li><strong>RGB:</strong> Color aditivo (luz). Pantallas y dispositivos digitales. Suma da blanco.</li><li><strong>CMYK:</strong> Color sustractivo (tinta). Impresión física. Suma da negro (K).</li></ul><p class='highlight-text'>Confundirlos genera errores graves de impresión.</p>",
    "media": "images/d07-martes-slide02.jpg",
    "notes": "<h3>Alerta técnica</h3><p>Diseñar en RGB para imprimir sin conversión previa a CMYK produce colores opacos y apagados en el papel.</p>"
  },
  {
    "layout": "split",
    "title": "Sistema Pantone y Modelo LAB",
    "content": "<p>Garantizando la consistencia del color:</p><ul><li><strong>Pantone:</strong> Tintas directas estandarizadas con códigos únicos. Garantiza el mismo tono en cualquier país e imprenta.</li><li><strong>LAB:</strong> Modelo independiente del dispositivo, abarca todo el espectro visible por el ojo humano.</li></ul>",
    "media": "images/d07-martes-slide03.jpg",
    "notes": "<h3>Explicación</h3><p>Explica que las marcas globales especifican sus colores corporativos en Pantone para evitar variaciones en el empaque.</p>"
  },
  {
    "layout": "split",
    "title": "Los 7 Contrastes de Itten",
    "content": "<p>Johannes Itten (Bauhaus) sistematizó la interacción del color:</p><ol><li>Contraste de tono (colores puros).</li><li>Contraste claro-oscuro.</li><li>Contraste frío-cálido (temperatura).</li><li>Contraste de complementarios.</li><li>Contraste simultáneo.</li><li>Contraste de saturación.</li><li>Contraste de cantidad (proporción).</li></ol>",
    "media": "images/d07-martes-slide04.jpg",
    "notes": "<h3>Ejemplo</h3><p>Muestra cómo el contraste simultáneo hace que un mismo gris se perciba claro sobre negro y oscuro sobre blanco.</p>"
  },
  {
    "layout": "split",
    "title": "Psicología y Cultura del Color",
    "content": "<p>El color transmite emociones, pero su significado depende del contexto:</p><ul><li>Asociaciones comunes: rojo (urgencia/pasión), azul (confianza/calma).</li><li><strong>Relatividad cultural:</strong> El blanco es pureza en Occidente y luto en Asia.</li><li>Predominancia por industria (azules y verdes en finanzas y salud).</li></ul>",
    "media": "images/d07-martes-slide05.jpg",
    "notes": "<h3>Discusión</h3><p>Debate cómo las marcas usan el color para posicionarse (ej. Coca-Cola vs. Pepsi).</p>"
  },
  {
    "layout": "grid",
    "title": "Daltonismo y Accesibilidad",
    "content": "<h2>Tipos de daltonismo y su impacto visual:</h2>",
    "cards": [
      {
        "num": "DEUT",
        "title": "Deuteranomalía",
        "desc": "Falta de sensibilidad al verde. Confusión entre rojos y verdes.",
        "icon": "💡"
      },
      {
        "num": "PROT",
        "title": "Protanopía",
        "desc": "Falta de sensibilidad al rojo. El rojo pierde brillo y los verdes se ven descoloridos.",
        "icon": "⚙️"
      },
      {
        "num": "TRIT",
        "title": "Tritanopía",
        "desc": "Falta de sensibilidad al azul. Paleta desplazada a verdes y rosas.",
        "icon": "🎨"
      },
      {
        "num": "ACRO",
        "title": "Acromatopsia",
        "desc": "Ausencia total de percepción del color. Todo en escala de grises.",
        "icon": "🔬"
      }
    ],
    "notes": "<h3>Importancia</h3><p>El daltonismo afecta a un porcentaje significativo de la población (principalmente hombres). Diseñar pensando en accesibilidad es un requisito legal y ético.</p>"
  },
  {
    "layout": "split",
    "title": "Regla del Indicador Doble",
    "content": "<p><strong>Nunca dependas únicamente del color para comunicar información crítica.</strong></p><ul><li>❌ Mal: Un texto de error que solo se pone rojo.</li><li>✅ Bien: Mensaje en rojo acompañado de un ícono de advertencia (⚠) y texto explícito.</li></ul>",
    "media": "images/d07-martes-slide07.jpg",
    "notes": "<h3>Ejemplo</h3><p>Esta regla es fundamental en interfaces digitales. Muestra ejemplos reales de accesibilidad en formularios.</p>"
  },
  {
    "layout": "split",
    "title": "La Prueba del Blanco y Negro",
    "content": "<p>Para verificar si tu jerarquía gráfica funciona:</p><ul><li>Pasa tu diseño a escala de grises.</li><li>Si la información clave se pierde o el botón principal se confunde con el fondo, falta <strong>contraste de luminosidad (valor)</strong>.</li><li>El contraste de tono solo no es suficiente.</li></ul>",
    "media": "images/d07-martes-slide08.jpg",
    "notes": "<h3>Consejo</h3><p>Diles que usen filtros de vista en Illustrator o Photoshop para previsualizar sus diseños en escala de grises.</p>"
  },
  {
    "layout": "split",
    "title": "Maquinarias de Impresión",
    "content": "<p>Cómo se produce el diseño físico a gran escala:</p><ul><li><strong>Impresión Offset:</strong> Ideal para grandes tiradas (libros, revistas). Costosa puesta en marcha, pero bajo costo unitario. Alta precisión de color.</li><li><strong>Impresión Digital:</strong> Ideal para tiradas cortas y personalizadas. Rápida producción, permite datos variables.</li></ul>",
    "media": "images/d07-martes-slide09.jpg",
    "notes": "<h3>Explicación</h3><p>Detalla que el offset usa planchas metálicas para cada color CMYK, mientras que la digital inyecta tinta directamente.</p>"
  },
  {
    "layout": "split",
    "title": "El Valor de la Postimpresión",
    "content": "<p>Técnicas que aportan valor táctil y visual al empaque:</p><ul><li><strong>Laca UV (Sectorizada):</strong> Brillo en zonas específicas del diseño.</li><li><strong>Hot Stamping:</strong> Aplicación de folia metálica (oro, plata) mediante calor.</li><li><strong>Troquelado:</strong> Corte personalizado del soporte físico (formas especiales).</li><li><strong>Relieve (Embossing):</strong> Generación de volumen táctil sobre el papel.</li></ul>",
    "media": "images/d07-martes-slide10.jpg",
    "notes": "<h3>Branding</h3><p>Asocia estas técnicas al TP Final (diseño de packaging y fanzine de marca).</p>"
  },
  {
    "layout": "split",
    "title": "Evita Combinaciones de Alto Riesgo",
    "content": "<p>Evita colocar textos sobre fondos donde el contraste dependa de estas parejas de colores sin diferencia de brillo:</p><ul><li>Rojo vs. Verde (Ilegible para daltónicos).</li><li>Azul vs. Violeta (Bajo contraste).</li><li>Verde vs. Marrón.</li></ul>",
    "media": "images/d07-martes-slide11.jpg",
    "notes": "<h3>Advertencia</h3><p>Esta diapositiva muestra gráficamente el problema de colocar texto teal sobre fondo óxido.</p>"
  },
  {
    "layout": "grid",
    "title": "Checklist del Color",
    "content": "<h2>Para tus entregas gráficas y digitales:</h2>",
    "cards": [
      {
        "num": "RGB",
        "title": "Pantallas",
        "desc": "Modo RGB a 72 dpi en formato PNG/JPG.",
        "icon": "💡"
      },
      {
        "num": "CMYK",
        "title": "Impresión",
        "desc": "Modo CMYK a 300 dpi con sangrías y marcas.",
        "icon": "⚙️"
      },
      {
        "num": "ACC",
        "title": "Contraste",
        "desc": "Contraste mínimo WCAG de 4.5:1 para texto normal.",
        "icon": "🎨"
      },
      {
        "num": "PNT",
        "title": "Corporativo",
        "desc": "Usa Pantone para logotipos físicos de marca.",
        "icon": "🔬"
      }
    ],
    "notes": "<h3>Consejo</h3><p>Indica el uso de herramientas como Adobe Color para verificar accesibilidad de contraste.</p>"
  },
  {
    "layout": "title",
    "title": "Práctica en Adobe Color",
    "subtitle": "Abran Adobe Color para crear una paleta de 3 colores corporativos accesibles para su marca.",
    "content": "<p class='highlight-text'>Prueben los contrastes de texto y simulen daltonismo.</p>",
    "notes": "<h3>Cierre</h3><p>Monitorea la creación de paletas y da feedback sobre la combinación de contrastes.</p>"
  }
];
    let currentIndex = 0;
    let notesOpen = false;

    const slideWrapper = document.getElementById('slide-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const slideCounter = document.getElementById('slide-counter');
    const progressBar = document.getElementById('progress-bar');
    const notesDrawer = document.getElementById('notes-drawer');
    const notesContent = document.getElementById('notes-content');
    const toggleNotesBtn = document.getElementById('toggle-notes-btn');
    const closeNotesBtn = document.getElementById('close-notes-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    // Automatic extension fallback if image format differs (.png, .jpg, .svg, .webp)
    function handleImageError(img) {
      const cleanSrc = img.src.split('?')[0];
      if (!img.dataset.triedExt) {
        img.dataset.triedExt = 'png';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.png') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'png') {
        img.dataset.triedExt = 'jpg';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.jpg') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'jpg') {
        img.dataset.triedExt = 'svg';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.svg') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'svg') {
        img.dataset.triedExt = 'webp';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.webp') + '?t=' + Date.now();
      }
    }

    function renderSlide(index) {
      const slide = slidesData[index];
      const slideNum = String(index + 1).padStart(2, '0');
      
      let layoutHtml = '';

      if (slide.layout === 'title') {
        layoutHtml = `
          <div class="slide-content layout-title">
            <div class="class-pill">MÓDULO 1 &bull; DÍA 7</div>
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
            ${slide.subtitle ? `<div class="highlight-text" style="margin-top:20px;">${slide.subtitle}</div>` : ''}
          </div>
        `;
      } else if (slide.layout === 'quote') {
        layoutHtml = `
          <div class="slide-content layout-quote">
            <div class="quote-text">“${slide.content}”</div>
            <div class="quote-author">— ${slide.title}</div>
          </div>
        `;
      } else if (slide.layout === 'split') {
        let mediaContent = '';
        if (slide.media) {
          const mediaSrc = slide.media.startsWith('images/') ? '../' + slide.media : slide.media;
          if (slide.media.trim().startsWith('<svg')) {
            mediaContent = slide.media;
          } else {
            mediaContent = `<img src="${mediaSrc}?t=${Date.now()}" onerror="handleImageError(this)" alt="${slide.title}" style="max-width:100%; max-height:320px; object-fit:cover; border-radius:8px;">`;
          }
        } else {
          mediaContent = `<div class="image-placeholder">[IMAGEN: Ilus. o diagrama de ${slide.title}]</div>`;
        }

        layoutHtml = `
          <div class="layout-split">
            <div class="slide-content">
              <h2 class="slide-title">${slide.title}</h2>
              <div class="slide-body">${slide.content || ''}</div>
            </div>
            <div class="media-container">
              ${mediaContent}
            </div>
          </div>
        `;
      } else if (slide.layout === 'grid') {
        let cardsHtml = '';
        let gridCols = 'grid-3';
        if (slide.cards) {
          if (slide.cards.length === 2) gridCols = 'grid-2';
          else if (slide.cards.length === 4) gridCols = 'grid-4';

          cardsHtml = slide.cards.map(c => `
            <div class="card">
              ${c.icon ? `<div class="card-icon">${c.icon}</div>` : ''}
              ${c.num && !c.icon ? `<div class="card-num">${c.num}</div>` : ''}
              <div class="card-title">${c.title}</div>
              <div class="card-desc">${c.desc}</div>
            </div>
          `).join('');
        }

        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
            <div class="layout-grid-container ${gridCols}">
              ${cardsHtml}
            </div>
          </div>
        `;
      } else {
        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
          </div>
        `;
      }

      slideWrapper.innerHTML = `
        <div class="slide-indicator">
          <span class="slide-num-badge">${slideNum}</span>
        </div>
        ${layoutHtml}
        <div class="slide-footer-bar">
          <span>Martes: Color, Postimpresión y Procesos</span>
          <span>Día 7</span>
        </div>
      `;

      // Update speaker notes
      notesContent.innerHTML = slide.notes || '<p>No hay notas adicionales para esta diapositiva.</p>';

      // Update controls
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slidesData.length - 1;
      slideCounter.textContent = `${slideNum} / ${String(slidesData.length).padStart(2, '0')}`;
      progressBar.style.width = `${((index + 1) / slidesData.length) * 100}%`;
    }

    function goToNext() {
      if (currentIndex < slidesData.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    // Navigation Events
    nextBtn.addEventListener('click', goToNext);
    prevBtn.addEventListener('click', goToPrev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        goToNext();
      } else if (e.key === 'ArrowLeft') {
        goToPrev();
      } else if (e.key.toLowerCase() === 'p') {
        toggleNotes();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Notes drawer toggle
    function toggleNotes() {
      notesOpen = !notesOpen;
      notesDrawer.classList.toggle('open', notesOpen);
    }

    toggleNotesBtn.addEventListener('click', toggleNotes);
    closeNotesBtn.addEventListener('click', () => {
      notesOpen = false;
      notesDrawer.classList.remove('open');
    });

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Initial Render
    renderSlide(currentIndex);
  </script>
</body>
</html>
